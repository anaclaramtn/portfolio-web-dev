<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="dev.svg">
</head>
<body>

    <main class="terminal">

        <header class="terminal-header">
            <div class="buttons">
                <span class="btn close"></span>
                <span class="btn minimize"></span>
                <span class="btn maximize"></span>
            </div>
            <span class="title">guest@terminal.dev:~</span>
        </header>

        <section class="terminal-body">
            <p class="welcome-text">Bem vindo ao meu portfolio!</p>
            <p>Digite <span class="highlight">'help'</span> para ver a lista de comandos.</p>
            <br>
            <p class="prompt">> ls -la ./projects</p>

            <ul class="project-list">
            <li>
                <span class="file-perm"></span>
                <a href="#" target="_blank" class="file-name">project/</a>
                <span class="file-desc"># Project</span>
            </li>
            <li>
                <span class="file-perm"></span> 
                <a href="#" target="_blank" class="file-name">project</a>
                <span class="file-desc"># Project</span>
            </li>
            </ul>

            <div class="command-line">
                <span class="prompt">guest@terminal:~$</span>
                <span class="cursor"></span>
            </div>
        </section>

    </main>
</body>
</html>
